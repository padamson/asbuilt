[workspace]
members = ["crates/*"]
# Fixture crates under a member's tests/ carry their own `[workspace]`
# table; this is the second belt, so a fixture that forgets one still
# never joins this workspace.
exclude = ["crates/asbuilt-rust/tests/fixtures", "crates/asbuilt/tests/fixtures"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/padamson/asbuilt"
authors = ["Paul Adamson"]

[workspace.dependencies]
# One version for the whole workspace; the two path deps carry it too
# because every crate publishes, and crates.io needs a version on a path
# dep. Bump all three together at release.
asbuilt-core = { version = "0.1.0", path = "crates/asbuilt-core" }
asbuilt-rust = { version = "0.1.0", path = "crates/asbuilt-rust" }
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2"
toml = "1"
# Scratch directories for integration-test fixtures in tests/common.
tempfile = "3"
