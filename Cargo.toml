[workspace]
members = ["crates/*"]
# Fixture crates under a member's tests/ carry their own `[workspace]`
# table; this is the second belt, so a fixture that forgets one still
# never joins this workspace.
exclude = [
    "crates/asbuilt-rust/tests/fixtures",
    "crates/asbuilt/tests/fixtures",
    "crates/site",
    "crates/site-e2e",
]
# The landing site crates are excluded too: `crates/site` targets wasm32 and
# both pull a large tree that has no place in the shipped crates' supply
# chain. They carry their own `[workspace]` table and `Cargo.lock`, and
# `asbuilt.toml` lists them under `extra_manifests` so the survey still
# covers them.
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/padamson/asbuilt"
homepage = "https://padamson.github.io/asbuilt/"
readme = "README.md"
authors = ["Paul Adamson"]

[workspace.dependencies]
# One version for the whole workspace; the two path deps carry it too
# because every crate publishes, and crates.io needs a version on a path
# dep. Bump all three together at release.
asbuilt-core = { version = "0.2.0", path = "crates/asbuilt-core" }
asbuilt-rust = { version = "0.2.0", path = "crates/asbuilt-rust" }
clap = { version = "4", features = ["derive"] }
# Markdown in the one-paragraph descriptions the docs generator renders;
# `html` only, no CLI helpers.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
syn = { version = "3", features = ["full", "visit"] }
thiserror = "2"
toml = "1"
# Scratch directories for integration-test fixtures in tests/common.
tempfile = "3"
