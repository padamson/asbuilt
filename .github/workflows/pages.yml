name: Pages

# Versioned deploy of the landing site to the `gh-pages` branch, served
# as project Pages at https://padamson.github.io/asbuilt/:
#   - push to main            -> rebuilds /asbuilt/dev/   (unreleased preview)
#   - workflow_dispatch+input -> builds /asbuilt/v<version>/ from CURRENT
#                                source (a release runs `gh workflow run
#                                pages.yml -f version=X.Y.Z --ref vX.Y.Z`;
#                                see CLAUDE.md "Release process")
#   - pull request            -> builds and gates only, no deploy
# Each run regenerates /asbuilt/versions.json (the switcher's manifest)
# and the root redirect to the latest release. Every snapshot carries this
# repo's own architecture documentation under /architecture/: `asbuilt
# render` draws the views with LikeC4 and Graphviz, and `asbuilt docs`
# writes the HTML tree that embeds them, so the site is the dogfood.
#
# Deploys only if the playwright-rs test passes against the built output.
# The site crates are excluded from the root workspace, so this is the
# only workflow that builds and drives them (test.yml only compiles them),
# and the pull-request trigger is what makes it a check: Dependabot bumps
# these crates' lockfiles and its PRs merge once main's required checks
# pass, so a site-breaking bump would otherwise merge itself. The
# pull-request trigger has no paths filter for the same reason: a required
# check that never reports leaves a PR waiting forever.
#
# One-time setup after the first run: Settings -> Pages -> Build and
# deployment -> Source: "Deploy from a branch" -> Branch: gh-pages / (root).

on:
  push:
    branches: [main]
    paths:
      # The generated documentation reads the model and the crates it
      # describes, so a code change anywhere is a site change.
      - "crates/**"
      - "docs/architecture/**"
      - "asbuilt.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish current source as /asbuilt/v<version>/ (e.g. 0.1.0). Blank = normal /asbuilt/dev/ build."
        required: false
        default: ""

permissions:
  contents: read

# One deploy at a time; don't cancel an in-progress deploy. Pull-request
# runs deploy nothing, so they get their own group and never queue behind
# a deploy or hold one up.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Build, dogfood-gate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push to gh-pages (read-only on a pull request, which deploys nothing)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine target snapshot
        id: target
        run: |
          ver="${{ github.event.inputs.version }}"
          if [ -n "$ver" ]; then
            # Guard the snapshot dir name and manifest sort: the input must be a
            # bare MAJOR.MINOR.PATCH. A 'v' prefix (natural, since tags are
            # v-prefixed) would otherwise publish /vv<ver>/ and skew the
            # latest-release computation in update-manifest.sh.
            if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version input must be a bare semver like 0.1.0 (no 'v' prefix), got: '$ver'"
              exit 1
            fi
            echo "site_version=$ver" >> "$GITHUB_OUTPUT"
            echo "dest=v$ver" >> "$GITHUB_OUTPUT"
          else
            echo "site_version=dev" >> "$GITHUB_OUTPUT"
            echo "dest=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # Three trees: the root workspace (asbuilt itself renders and writes
      # the documentation) and the two excluded site crates.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: pages
          workspaces: |
            .
            crates/site
            crates/site-e2e

      # Trunk is pinned to the version used locally; bump both together.
      - name: Install Trunk and cargo-nextest
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: trunk@0.21.14,cargo-nextest

      # The driver is assembled by playwright-rs's build.rs into the user
      # cache beside the browsers, so one cache entry holds both.
      - name: Cache Playwright driver and browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-rust
          key: ${{ runner.os }}-playwright-browsers-1.63.0-v1
          restore-keys: ${{ runner.os }}-playwright-browsers-1.63.0-

      - name: Quiesce host package manager
        timeout-minutes: 5
        run: ./scripts/quiesce-apt.sh

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Tool versions
        run: |
          rustc --version && trunk --version && cargo nextest --version | head -1
          node --version && npx --version && dot -V

      - name: Format + lint site crates
        run: |
          cargo fmt --manifest-path crates/site/Cargo.toml -- --check
          cargo fmt --manifest-path crates/site-e2e/Cargo.toml -- --check
          cargo clippy --manifest-path crates/site/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
          cargo clippy --manifest-path crates/site-e2e/Cargo.toml --all-targets -- -D warnings

      # Host-target unit tests for the site crate (the switcher's version
      # and banner logic, the prefix helpers, the versions.json contract).
      - name: Test site crate
        run: cargo nextest run --manifest-path crates/site/Cargo.toml --config-file .config/nextest.toml

      # This repo's own model, drawn. `render` refuses a stale model, so a
      # commit that changed the code without re-running `survey` fails
      # here before anything is built. The context view is the landing
      # page's example figure; the rest are embedded by `docs` below.
      - name: Render the architecture views
        run: |
          cargo run --release -p asbuilt -- render
          cp docs/architecture/views/context.svg crates/site/public/views/

      # Dogfood gate build: a canonical root-served dev build the test can
      # drive. SITE_VERSION=dev so the switcher's dev-banner assertion
      # holds; public-url stays "/" so the e2e server resolves assets.
      # Trunk clears dist/ on every build, so the documentation tree is
      # written after it.
      - name: Build site for dogfood gate
        run: |
          (cd crates/site && SITE_VERSION=dev trunk build --release)
          cargo run --release -p asbuilt -- docs --no-render -o crates/site/dist/architecture

      # The playwright-rs CLI installs the browser. `cargo install` is a
      # no-op when that version is already in the cached ~/.cargo/bin.
      - name: Install Chromium
        # Bounded: a contended apt blocks rather than failing (see quiesce-apt.sh).
        timeout-minutes: 15
        run: |
          cargo install --locked playwright-rs --version 0.19.0 --features cli
          playwright-rs install chromium --with-deps

      # The landing tests drive the root-served build; the two snapshot
      # tests run below against the artifact that ships.
      - name: Dogfood test (deploy gate)
        run: >
          cargo nextest run --manifest-path crates/site-e2e/Cargo.toml
          --config-file .config/nextest.toml --profile ci --run-ignored only
          -E 'test(/^site_/) and not test(/^site_(deployed_snapshot|architecture)/)'

      # Build the actual snapshot for the target subpath. Assets resolve
      # under /asbuilt/<dest>/; SITE_VERSION labels the build for the
      # switcher and banner. The receipts the gate just wrote ride along.
      - name: Build snapshot for ${{ steps.target.outputs.dest }}
        run: |
          (cd crates/site && SITE_VERSION="${{ steps.target.outputs.site_version }}" \
            trunk build --release --public-url "/asbuilt/${{ steps.target.outputs.dest }}/" --dist dist-snapshot \
            && rm -rf dist-snapshot/receipts && cp -r public/receipts dist-snapshot/receipts)
          cargo run --release -p asbuilt -- docs --no-render -o crates/site/dist-snapshot/architecture

      # Gate the artifact that actually ships. The dogfood test above
      # drives the root-served dev build, so it cannot see sub-path asset
      # breakage or release-only rendering; this serves dist-snapshot
      # under its real base path and asserts both, plus the architecture
      # section: every crate in the model linked, a view that loads.
      - name: Snapshot tests (deploy gate)
        env:
          SNAPSHOT_DIST: ${{ github.workspace }}/crates/site/dist-snapshot
          SNAPSHOT_BASE: /asbuilt/${{ steps.target.outputs.dest }}/
          SNAPSHOT_VERSION: ${{ steps.target.outputs.site_version }}
        run: >
          cargo nextest run --manifest-path crates/site-e2e/Cargo.toml
          --config-file .config/nextest.toml --profile ci --run-ignored only
          -E 'test(/^site_(deployed_snapshot|architecture)/)'

      - name: Check out gh-pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            # -B puts the worktree on a local gh-pages branch (not detached HEAD)
            # reset to the remote, so the commit/push below has a ref to push.
            git worktree add -B gh-pages gh origin/gh-pages
          else
            # First run: create the branch off HEAD, then clear inherited files
            # so gh-pages holds only deployed site content.
            git worktree add -b gh-pages gh
            (cd gh && git rm -rqf . >/dev/null 2>&1 || true)
          fi

      # No CNAME: project Pages serve from /asbuilt/, and the manifest
      # script writes the root redirect with that prefix.
      - name: Assemble snapshot + manifest
        if: github.event_name != 'pull_request'
        run: |
          dest="${{ steps.target.outputs.dest }}"
          rm -rf "gh/$dest"
          mkdir -p "gh/$dest"
          cp -r crates/site/dist-snapshot/. "gh/$dest/"
          bash crates/site/deploy/update-manifest.sh gh /asbuilt
          touch gh/.nojekyll

      - name: Commit + push gh-pages
        if: github.event_name != 'pull_request'
        run: |
          cd gh
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Deploy ${{ steps.target.outputs.dest }} (${{ github.sha }})"
            git push origin HEAD:gh-pages
          fi
