name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Job-scoped permissions: the default for every job is read-only, and
# each job that writes names exactly what it writes. A build job running
# third-party build scripts must not hold a token that can create a
# release or mint attestations.
permissions:
  contents: read

jobs:
  # Each target builds, tests, archives and attests on its own runner, then
  # hands its archive on as a workflow artifact. Nothing is public until
  # `github-release`, which needs every one of them.
  build-release:
    name: Build ${{ matrix.target }}
    needs: [semver-checks, release-refs]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # The targets beyond the runners' own are built on every push too,
        # by `release-targets` in test.yml; a target added here goes there.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Static binaries: what cargo binstall and the action install on
          # Linux, since they run on any glibc or on musl.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      # `matrix.target` in shared-key prevents the two macos matrix
      # entries (x86_64 + aarch64 Apple Darwin) from clobbering each
      # other's cache — Swatinem's auto-key includes runner.os but not
      # the inline --target flag.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      # `--locked`: the shipped binary is built from the lockfile CI tested
      # and cargo-vet reviewed, never a fresh resolution.
      - name: Run tests
        run: cargo nextest run --locked --workspace --target ${{ matrix.target }}

      # A failed release build fails the release. Library crates build
      # fine here too; the binary-only steps below check for a binary
      # before doing anything.
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --verbose

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY_NAME=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; bins=[t['name'] for p in pkgs for t in p['targets'] if 'bin' in t['kind']]; print(bins[0] if bins else '')")
          if [ -n "$BINARY_NAME" ] && [ -f "target/${{ matrix.target }}/release/$BINARY_NAME" ]; then
            strip "target/${{ matrix.target }}/release/$BINARY_NAME"
          fi

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY_NAME=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; bins=[t['name'] for p in pkgs for t in p['targets'] if 'bin' in t['kind']]; print(bins[0] if bins else '')")
          if [ -n "$BINARY_NAME" ] && [ -f "target/${{ matrix.target }}/release/$BINARY_NAME" ]; then
            tar czf "$BINARY_NAME-v${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "$BINARY_NAME"
          fi

      # From inside the release directory, so the binary sits at the
      # archive's root as it does in the tarballs (7z keeps the path it is
      # given; the 0.2.0 zip nested it under target/). The archive path is
      # relative, so it means the same to bash and to the native 7z.
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BINARY_NAME=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; bins=[t['name'] for p in pkgs for t in p['targets'] if 'bin' in t['kind']]; print(bins[0] if bins else '')")
          if [ -n "$BINARY_NAME" ] && [ -f "target/${{ matrix.target }}/release/${BINARY_NAME}.exe" ]; then
            archive="${BINARY_NAME}-v${{ steps.get_version.outputs.version }}-${{ matrix.target }}.zip"
            (cd "target/${{ matrix.target }}/release" && 7z a "../../../$archive" "${BINARY_NAME}.exe")
          fi

      # Before anything is public, so a release whose attestation fails
      # publishes nothing. Consumers check an archive with `gh attestation
      # verify <archive> --repo padamson/asbuilt`; no `continue-on-error`.
      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            *.tar.gz
            *.zip

      - name: Hand the archive on
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  # One job publishes every archive, after every target built: a release is
  # whole or absent, never missing the targets whose runner failed.
  github-release:
    name: GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release and attach files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install parse-changelog
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: parse-changelog

      - name: Collect the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Generate release notes
        run: parse-changelog CHANGELOG.md "${GITHUB_REF_NAME#v}" > release_notes.md

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          body_path: release_notes.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The tag's version against the latest one on crates.io, per published
  # crate: a breaking change under a version that does not allow one
  # fails here, before the GitHub Release or any crate is published. On
  # 0.x a minor bump (0.1 to 0.2) allows one.
  semver-checks:
    name: Semver Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-semver-checks

      - name: Check semver compatibility
        run: cargo semver-checks check-release --workspace

  # Everything that names the release (the workspace and dependency
  # versions, the hook rev consumers copy, the changelog section, the
  # README's Status line, the roadmap's milestone) agrees with the tag,
  # before the GitHub Release or any crate is published.
  release-refs:
    name: Release references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check release references
        run: ./scripts/check-release-refs.sh "${GITHUB_REF_NAME#v}"

  publish-crates:
    name: Publish to crates.io
    needs: [github-release]
    runs-on: ubuntu-latest
    # Only publishing needs to mint an OIDC token, and `id-token: write`
    # is what lets a job request one.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      # Trusted publishing: exchange a GitHub OIDC token for a crates.io
      # token scoped to this repo + workflow and valid for minutes,
      # instead of holding a long-lived CARGO_REGISTRY_TOKEN that works
      # from anywhere and never expires. The action's post step revokes
      # it when the job ends. Configure the trusted publisher on
      # crates.io first; with none configured this step fails, which is
      # correct. There is deliberately no "skip if not configured" guard
      # and no `continue-on-error` on the publish: both turn a broken
      # release into a green run with no crate.
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      # Three crates, one version, one tag, published in dependency order
      # (cargo waits for each to be indexed before the next resolves it).
      # Each crate needs its own trusted publisher on crates.io (owner
      # padamson, repo asbuilt, workflow release.yml), which can only be
      # added after the crate's first publish, done by hand with a token
      # scoped to publish-new. So a crate whose version is already on
      # crates.io is skipped with a line saying so: that is the first
      # release's case, and a rerun's.
      # Nothing else is skipped; a missing publisher fails at the
      # authentication step above, and a failed publish fails the job.
      - name: Publish to crates.io
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in asbuilt-core asbuilt-rust asbuilt; do
            if curl -sf -A "asbuilt release (github.com/padamson/asbuilt)" \
                "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io; skipping it."
            else
              cargo publish -p "$crate"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
