name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Job-scoped permissions: the default for every job is read-only, and
# each job that writes names exactly what it writes. A build job running
# third-party build scripts must not hold a token that can create a
# release or mint attestations.
permissions:
  contents: read

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write       # create the GitHub Release and attach files
      id-token: write       # provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      # `matrix.target` in shared-key prevents the two macos matrix
      # entries (x86_64 + aarch64 Apple Darwin) from clobbering each
      # other's cache — Swatinem's auto-key includes runner.os but not
      # the inline --target flag.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install cargo-nextest & parse-changelog
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-nextest,parse-changelog

      - name: Run tests
        run: cargo nextest run --workspace --target ${{ matrix.target }}

      # A failed release build fails the release. Library crates build
      # fine here too; the binary-only steps below check for a binary
      # before doing anything.
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY_NAME=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; bins=[t['name'] for p in pkgs for t in p['targets'] if 'bin' in t['kind']]; print(bins[0] if bins else '')")
          if [ -n "$BINARY_NAME" ] && [ -f "target/${{ matrix.target }}/release/$BINARY_NAME" ]; then
            strip "target/${{ matrix.target }}/release/$BINARY_NAME"
          fi

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY_NAME=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; bins=[t['name'] for p in pkgs for t in p['targets'] if 'bin' in t['kind']]; print(bins[0] if bins else '')")
          if [ -n "$BINARY_NAME" ] && [ -f "target/${{ matrix.target }}/release/$BINARY_NAME" ]; then
            tar czf "$BINARY_NAME-v${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "$BINARY_NAME"
          fi

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BINARY_NAME=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; bins=[t['name'] for p in pkgs for t in p['targets'] if 'bin' in t['kind']]; print(bins[0] if bins else '')")
          if [ -n "$BINARY_NAME" ] && [ -f "target/${{ matrix.target }}/release/${BINARY_NAME}.exe" ]; then
            7z a "${BINARY_NAME}-v${{ steps.get_version.outputs.version }}-${{ matrix.target }}.zip" "target/${{ matrix.target }}/release/${BINARY_NAME}.exe"
          fi

      - name: Generate release notes
        shell: bash
        run: parse-changelog CHANGELOG.md ${{ steps.get_version.outputs.version }} > release_notes.md

      - name: Upload release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            *.tar.gz
            *.zip
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A library crate produces no archive, and the action fails on an
      # empty subject list. That is the only failure this tolerates; a
      # binary crate whose attestation fails should look into it.
      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            *.tar.gz
            *.zip
        continue-on-error: true

  publish-crates:
    name: Publish to crates.io
    needs: [build-release]
    runs-on: ubuntu-latest
    # Only publishing needs to mint an OIDC token, and `id-token: write`
    # is what lets a job request one.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      # Trusted publishing: exchange a GitHub OIDC token for a crates.io
      # token scoped to this repo + workflow and valid for minutes,
      # instead of holding a long-lived CARGO_REGISTRY_TOKEN that works
      # from anywhere and never expires. The action's post step revokes
      # it when the job ends. Configure the trusted publisher on
      # crates.io first (SETUP.md); with none configured this step fails,
      # which is correct. There is deliberately no "skip if not
      # configured" guard and no `continue-on-error` on the publish: both
      # turn a broken release into a green run with no crate.
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      # Three crates, one version, one tag. `--workspace` publishes them
      # in dependency order (asbuilt-core, asbuilt-rust, asbuilt) and
      # waits for each to be indexed. Each crate needs its own trusted
      # publisher on crates.io (owner padamson, repo asbuilt, workflow
      # release.yml), added after its first manual publish (SETUP.md).
      # If `--workspace` ever misbehaves, the fallback is three steps:
      # `cargo publish -p asbuilt-core`, `-p asbuilt-rust`, `-p asbuilt`.
      - name: Publish to crates.io
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
