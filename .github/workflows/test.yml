name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  skill-version:
    name: Skill version guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The pre-commit hook of the same name is per-clone and opt-in, so a
    # hookless clone or a `--no-verify` commit would ship a skill edit
    # without the version bump installed consumers key their updates on.
    # Same script, run against the PR base or the tip before the push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute diff base
        id: base
        uses: ./.github/actions/diff-base

      # The script treats an unusable ref as an error; skipping when there
      # is nothing to compare against is this job's call, not the script's.
      - name: Check the skill version against the base
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No reachable base (first push, manual run, or rewritten history); nothing to compare."
            exit 0
          fi
          scripts/check-skill-version-bumped.sh --base "$BASE"

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.88"

      # If your crate uses `include_bytes!` against build-generated
      # artifacts (wasm pkgs, codegen output, etc.), stub them with
      # `touch` here so `cargo check` succeeds — the bytes aren't
      # exercised at compile time, only their existence on disk is.
      - name: Check compilation on MSRV
        run: cargo check --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: lint

      - name: Brand mark copy current
        run: scripts/check-brand-copy.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # nextest does not run doctests, so this is its own step. The
      # crate keeps at least one doctest (the seed's `classify` has one),
      # which is what makes this step honest; delete the step if the
      # crate ever has none rather than running a no-op. The guard is on
      # the library target, not on doctests: `cargo test --doc` errors
      # outright on a bin-only crate, so the step goes with `src/lib.rs`.
      - name: Run doc-tests
        if: hashFiles('**/src/lib.rs') != ''
        run: cargo test --doc --workspace

      - name: Generate documentation
        run: cargo doc --no-deps --workspace

  # The `likec4_` tests are `#[ignore]`d because they need Node (for
  # `npx likec4`) and Graphviz, which a fresh clone may lack. The ubuntu
  # runner image has Node; this job adds Graphviz and runs only them.
  likec4:
    name: LikeC4 validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: likec4

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Tool versions
        run: node --version && npx --version && dot -V

      # The committed model and the curated views beside it, through the
      # real parser. First, because it also installs the pinned LikeC4
      # into the npx cache once: the tests below start npx in parallel,
      # and on a cold cache they race to unpack the same package into the
      # same directory (npm's `ENOENT` on a tar entry).
      - name: Validate this repo's own model
        run: cargo run -p asbuilt -- validate

      - name: Run the tests that need LikeC4
        run: cargo nextest run --workspace --profile ci --run-ignored only -E 'test(/^likec4_/)'

  # The site crates are excluded from the workspace, so nothing above
  # compiles them; this catches an API change that breaks them before the
  # Pages job (which builds them for real) runs. Compile-only, never a
  # browser launch: PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD at job level skips
  # playwright-rs's ~90 MB driver assembly (job level, not step level:
  # rerun-if-env-changed would rebuild it on the next step). `--locked`
  # fails on a lockfile the pre-commit hook would have flagged.
  excluded-crates:
    name: Excluded crates compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: excluded
          workspaces: |
            crates/site
            crates/site-e2e

      - name: Check the site crate for its real target
        run: cargo check --manifest-path crates/site/Cargo.toml --locked --target wasm32-unknown-unknown --all-targets

      - name: Check the e2e crate
        run: cargo check --manifest-path crates/site-e2e/Cargo.toml --locked --all-targets

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # nextest's slow-timeout catches a hung test; this catches a hung
    # runner or a wedged tool install.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Build
        run: cargo build --verbose

      # `--profile ci` (.config/nextest.toml): retries on, so a retried
      # pass is reported FLAKY instead of hiding, and a longer slow-timeout.
      - name: Run tests
        run: cargo nextest run --workspace --profile ci

      # asbuilt surveying itself on every platform: the committed model
      # must be byte-identical to a fresh survey here, which is the
      # cheapest cross-platform determinism proof there is and needs no
      # Node.
      - name: Run asbuilt check
        run: cargo run -p asbuilt -- check
