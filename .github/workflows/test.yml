name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  skill-version:
    name: Skill version guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The pre-commit hook of the same name is per-clone and opt-in, so a
    # hookless clone or a `--no-verify` commit would ship a skill edit
    # without the version bump installed consumers key their updates on.
    # Same script, run against the PR base or the tip before the push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute diff base
        id: base
        uses: ./.github/actions/diff-base

      # The script treats an unusable ref as an error; skipping when there
      # is nothing to compare against is this job's call, not the script's.
      - name: Check the skill version against the base
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No reachable base (first push, manual run, or rewritten history); nothing to compare."
            exit 0
          fi
          scripts/check-skill-version-bumped.sh --base "$BASE"

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.88"

      # If your crate uses `include_bytes!` against build-generated
      # artifacts (wasm pkgs, codegen output, etc.), stub them with
      # `touch` here so `cargo check` succeeds — the bytes aren't
      # exercised at compile time, only their existence on disk is.
      - name: Check compilation on MSRV
        run: cargo check --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: lint

      - name: Brand mark copy current
        run: scripts/check-brand-copy.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # nextest does not run doctests, so this is its own step. The
      # crate keeps at least one doctest (the seed's `classify` has one),
      # which is what makes this step honest; delete the step if the
      # crate ever has none rather than running a no-op. The guard is on
      # the library target, not on doctests: `cargo test --doc` errors
      # outright on a bin-only crate, so the step goes with `src/lib.rs`.
      - name: Run doc-tests
        if: hashFiles('**/src/lib.rs') != ''
        run: cargo test --doc --workspace

      - name: Generate documentation
        run: cargo doc --no-deps --workspace

  # The `likec4_` tests are `#[ignore]`d because they need Node (for
  # `npx likec4`) and Graphviz, which a fresh clone may lack. The ubuntu
  # runner image has Node; this job adds Graphviz and runs only them.
  likec4:
    name: LikeC4 validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: likec4

      - name: Install cargo-nextest
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-nextest

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Tool versions
        run: node --version && npx --version && dot -V

      # The committed model and the curated views beside it, through the
      # real parser. First, because it also installs the pinned LikeC4
      # into the npx cache once: the tests below start npx in parallel,
      # and on a cold cache they race to unpack the same package into the
      # same directory (npm's `ENOENT` on a tar entry).
      - name: Validate this repo's own model
        run: cargo run -p asbuilt -- validate

      - name: Run the tests that need LikeC4
        run: cargo nextest run --workspace --profile ci --run-ignored only -E 'test(/^likec4_/)'

  # The site crates are excluded from the workspace, so nothing above
  # compiles them; this catches an API change that breaks them before the
  # Pages job (which builds them for real) runs. Compile-only, never a
  # browser launch: PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD at job level skips
  # playwright-rs's ~90 MB driver assembly (job level, not step level:
  # rerun-if-env-changed would rebuild it on the next step). `--locked`
  # fails on a lockfile the pre-commit hook would have flagged.
  excluded-crates:
    name: Excluded crates compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: excluded
          workspaces: |
            crates/site
            crates/site-e2e

      - name: Check the site crate for its real target
        run: cargo check --manifest-path crates/site/Cargo.toml --locked --target wasm32-unknown-unknown --all-targets

      - name: Check the e2e crate
        run: cargo check --manifest-path crates/site-e2e/Cargo.toml --locked --all-targets

  # The release targets no runner here builds natively, tested and run on
  # every push so the tag is not the first time: keep the list in step
  # with the build matrix in release.yml.
  release-targets:
    name: Release target ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-target-${{ matrix.target }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --locked --workspace --profile ci --target ${{ matrix.target }}

      - name: Build the release binary and run it
        run: |
          cargo build --locked --release -p asbuilt --target ${{ matrix.target }}
          ./target/${{ matrix.target }}/release/asbuilt --version
          ./target/${{ matrix.target }}/release/asbuilt check

  # The published action (action.yml), run from this checkout against a
  # release that exists. 0.2.0 exercises every install path: an attested
  # download (the glibc archive on x86_64 Linux, the zip with its nested
  # binary on Windows) and the cargo install fallback on aarch64 Linux,
  # which it shipped no archive for. Then the pin read from asbuilt.toml,
  # and the error when there is neither a pin nor an input.
  action:
    name: Action on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # For the cargo install fallback, rather than whatever the image has.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      # The fixture's committed model follows main's emitter, not this
      # release's, so the release surveys it first: the check then proves
      # the action, not the release agreeing with main.
      - name: Survey the consumer fixture with a released asbuilt
        uses: ./
        with:
          version: "0.2.0"
          working-directory: crates/asbuilt/tests/fixtures/consumer
          command: survey

      - name: Check the consumer fixture with a released asbuilt
        id: released
        uses: ./
        with:
          version: "0.2.0"
          working-directory: crates/asbuilt/tests/fixtures/consumer

      - name: The release asked for is the one on the PATH
        shell: bash
        run: test "$(asbuilt --version)" = "asbuilt 0.2.0"

      # Graphviz installed by the action (apt, brew, choco), then the tree
      # rendered with it.
      - name: Write the fixture's documentation tree
        uses: ./
        with:
          version: "0.2.0"
          working-directory: crates/asbuilt/tests/fixtures/consumer
          command: docs -o site

      - name: The tree has its index and a rendered view
        shell: bash
        run: |
          site=crates/asbuilt/tests/fixtures/consumer/site
          test -f "$site/index.html"
          ls "$site"/views/*.svg

      # Which commands get Graphviz, decided by the script the action runs.
      - name: Graphviz is installed for render and docs only
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: |
          expect() {
            got=$(action/needs-graphviz.sh "$1")
            [ "$got" = "$2" ] || { echo "\"$1\": got \"$got\", expected \"$2\""; exit 1; }
          }
          expect "check" ""
          expect "" ""
          expect "validate" ""
          expect "validate render" ""
          expect "render" "render"
          expect "docs -o site" "docs"
          expect "docs -o docs" "docs"
          expect "docs --no-render -o docs" ""
          expect "--config x.toml docs" "docs"
          expect "--config=x.toml render" "render"

      # 0.2.0 does not read the pin itself, so these install only.
      - name: Write a pinned config and one without a pin
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pinned" "$RUNNER_TEMP/unpinned"
          printf 'asbuilt = "0.2.0"\n\n[output]\npath = "m.c4"\n' > "$RUNNER_TEMP/pinned/asbuilt.toml"
          printf '[output]\npath = "m.c4"\n' > "$RUNNER_TEMP/unpinned/asbuilt.toml"

      - name: The pin chooses the release
        id: pinned
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/pinned
          command: ""

      - name: It installed the pinned release
        shell: bash
        run: test "${{ steps.pinned.outputs.version }}" = 0.2.0

      - name: No pin and no input
        id: unpinned
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/unpinned
          command: ""

      - name: It failed choosing a release, before installing anything
        shell: bash
        run: |
          test "${{ steps.unpinned.outcome }}" = failure
          test -z "${{ steps.unpinned.outputs.version }}"

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # nextest's slow-timeout catches a hung test; this catches a hung
    # runner or a wedged tool install.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-nextest

      - name: Build
        run: cargo build --verbose

      # `--profile ci` (.config/nextest.toml): retries on, so a retried
      # pass is reported FLAKY instead of hiding, and a longer slow-timeout.
      - name: Run tests
        run: cargo nextest run --workspace --profile ci

      # asbuilt surveying itself on every platform: the committed model
      # must be byte-identical to a fresh survey here, which is the
      # cheapest cross-platform determinism proof there is and needs no
      # Node.
      - name: Run asbuilt check
        run: cargo run -p asbuilt -- check
