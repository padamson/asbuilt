version: 2
updates:
  - package-ecosystem: "cargo"
    # `directory: "/"` reads only the root Cargo.lock. When a manifest range
    # moves, the root lock follows and any crate excluded from the workspace
    # (`[workspace] exclude`, or its own `[workspace]` table, which is how
    # wasm site and app crates, e2e crates, and cargo-fuzz dirs are usually
    # set up) keeps its own lock where it was, until a local build silently
    # re-resolves it. Once this repo has such a crate that commits its own
    # Cargo.lock, replace `directory:` with `directories:` naming the root
    # plus every one of them; `git ls-files '*Cargo.lock'` prints the list.
    # One entry keeps the schedule, cooldown, and groups on all of them and
    # opens one PR per group across the whole list.
    #
    # directories:
    #   - "/"
    #   - "/crates/site"
    #   - "/crates/e2e"
    #   - "/fuzz"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Wait before proposing a bump. cargo-vet's import sets (Mozilla, Google,
    # ISRG, ...) have not audited a version that is hours old, so day-zero
    # bumps fail Supply Chain Review by construction and the only response
    # is an exemption nobody audited. A week of lag lets the upstream audits
    # land first, skips releases that get yanked, and lets advisories
    # surface before adoption. Longer for majors, the riskiest and least
    # urgent.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Grouping keeps the weekly run to as few PRs as possible. Every cargo PR
    # edits Cargo.lock, so two open cargo PRs conflict the moment one merges
    # and the second must rebase and re-run CI; with N PRs the auto-merge
    # cascade costs O(N^2) runs. No merge machinery avoids a lockfile
    # conflict; fewer PRs is the fix.
    groups:
      # If this crate has git-pinned dependencies, add a group for them HERE,
      # above the others: a dependency joins the first group it matches, and
      # a git bump carries no semver update-type, so the update-type-filtered
      # groups below can never claim it and it would open a PR of its own.
      #
      # git-dependencies:
      #   patterns:
      #     - "some-git-pinned-crate"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Only default-days here: Dependabot's schema rejects the per-semver keys
    # for github-actions, and one bad key invalidates this whole file.
    cooldown:
      default-days: 7
    # One PR for the week's action bumps, same cascade rationale as cargo.
    groups:
      actions:
        patterns:
          - "*"
