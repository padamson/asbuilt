<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>asbuilt: architecture models that cannot drift</title>
    <meta
      name="description"
      content="asbuilt surveys a Rust code base into a LikeC4 architecture model and fails CI when the committed model no longer matches the code. Nothing hand-written, nothing annotated."
    />
    <!-- OG/Twitter tags so crawlers see content even though the page is CSR/WASM. -->
    <link rel="canonical" href="https://padamson.github.io/asbuilt/" />
    <meta property="og:title" content="asbuilt: architecture models that cannot drift" />
    <meta
      property="og:description"
      content="Survey a Rust code base into a LikeC4 model; fail CI when it drifts."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://padamson.github.io/asbuilt/" />
    <meta name="twitter:card" content="summary" />
    <link data-trunk rel="tailwind-css" href="input.css" />
    <!-- Receipts (written by the dogfood test), the rendered views
         (written by `asbuilt render`) and the architecture tree (written
         by `asbuilt docs`). Copied on every build, so they survive
         `trunk serve` rebuilds. -->
    <link data-trunk rel="copy-dir" href="public/receipts" />
    <link data-trunk rel="copy-dir" href="public/views" />
    <link data-trunk rel="copy-dir" href="public/architecture" />
    <!-- The architecture pages' palette, linked from the tree as
         ../architecture.css (`[docs] stylesheet` in asbuilt.toml). -->
    <link data-trunk rel="copy-file" href="architecture.css" />
    <!-- The brand from the repo's brand/ directory: the wordmark's faces
         (OFL, license alongside) beside the built stylesheet, and the mark
         as the favicon. -->
    <link data-trunk rel="copy-dir" href="../../brand/fonts" />
    <link data-trunk rel="copy-file" href="../../brand/mark.svg" />
    <link rel="icon" type="image/svg+xml" href="mark.svg" />
  </head>
  <body></body>
</html>
