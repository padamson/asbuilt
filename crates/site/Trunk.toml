[build]
target = "index.html"
# Local preview and the dogfood gate serve at the root; the deploy builds
# the snapshot with `--public-url /asbuilt/<dest>/` (project Pages).
public_url = "/"

[tools]
# Pin the Tailwind v4 standalone binary (Trunk defaults to a v3 release,
# which cannot parse the v4 `@import "tailwindcss"` / `@theme` input.css).
tailwindcss = "4.3.0"

[watch]
# `copy-dir` re-copies public/receipts and public/views into dist on every
# build. Without ignoring the generated files (and dist itself) the watcher
# sees the copy and retriggers the build, looping forever under
# `trunk serve`. Both are generated artifacts, never source.
ignore = ["public/receipts", "public/views", "dist"]
