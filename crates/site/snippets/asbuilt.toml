# The release the model is surveyed by: any other one stops with its
# install line. A top-level key, so above the first table.
asbuilt = "0.3.0"

# What no code can state: the processes and the browser asbuilt itself
# talks to (asbuilt's own externals).
[[externals]]
id = "cargo"
kind = "process"
title = "cargo metadata"
technology = "cargo subprocess"
description = "Lists the workspace's packages and targets; `--no-deps --offline`, so no lockfile is touched."

[[externals.relations]]
from = "asbuilt_rust.discover"
title = "runs"

[[externals]]
id = "likec4"
kind = "process"
title = "LikeC4 CLI"
technology = "Node.js via npx, pinned version"
description = "Validates, exports, and lays out the model. Only `validate`, `export json`, `render`, and `docs` reach it."

[[externals.relations]]
from = "asbuilt.likec4"
title = "runs"

[[externals]]
id = "graphviz"
kind = "process"
title = "Graphviz dot"
technology = "dot subprocess"
description = "Renders the Graphviz files LikeC4 generates to SVG."

[[externals.relations]]
from = "asbuilt.likec4"
title = "renders with"

[[externals]]
id = "chromium"
kind = "process"
title = "Chromium"
technology = "Playwright driver, via playwright-rs"
description = "The browser the site's end-to-end tests drive against the built landing page."

[[externals.relations]]
from = "asbuilt_site_e2e.tests"
title = "drives"
