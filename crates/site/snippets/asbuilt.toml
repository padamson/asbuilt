# asbuilt surveying itself. `asbuilt check` runs in the pre-commit hook
# and in CI, so docs/architecture/model.c4 cannot drift from the code.

[output]
path = "docs/architecture/model.c4"

[docs]
title = "asbuilt"
source_url = "https://github.com/padamson/asbuilt/blob/main/"

[rust]
# The landing site crates are excluded from the workspace (wasm32, big
# trees); they are still part of the architecture.
extra_manifests = ["crates/site/Cargo.toml"]

[[externals]]
id = "cargo"
kind = "process"
title = "cargo metadata"
technology = "cargo subprocess"
description = "Lists the workspace's packages and targets; `--no-deps --offline`, so no lockfile is touched."

[[externals.relations]]
from = "asbuilt_rust.discover"
title = "runs"

[[externals]]
id = "likec4"
kind = "process"
title = "LikeC4 CLI"
technology = "Node.js via npx, pinned version"
description = "Validates, exports and lays out the model. Only `validate`, `export json` and `render` reach it."

[[externals.relations]]
from = "asbuilt.likec4"
title = "runs"

[[externals]]
id = "graphviz"
kind = "process"
title = "Graphviz dot"
technology = "dot subprocess"
description = "Renders the Graphviz files LikeC4 generates to SVG."

[[externals.relations]]
from = "asbuilt.likec4"
title = "renders with"
