# asbuilt surveying itself. `asbuilt check` runs in the pre-commit hook
# and in CI, so docs/architecture/model.c4 cannot drift from the code.

[output]
path = "docs/architecture/model.c4"

[docs]
# The tree is the site's Architecture section: the crumbs read
# asbuilt / Architecture / <crate>, and the header links home.
title = "Architecture"
home_url = "../"
home_title = "asbuilt"
source_url = "https://github.com/padamson/asbuilt/blob/main/"
# The landing site's page colors, served from the site root beside the
# tree (crates/site/architecture.css, copied there by Trunk).
stylesheet = "../architecture.css"

# The landing site's ink-and-rust palette on every element kind: white
# module cards, rust crates and tan external tools on a light page; warm
# brown cards and a deeper rust on the site's ink in the dark. The docs
# pages switch between the two; the rendered SVG files use the light set.
[theme]
component = { light = "#ffffff", dark = "#3d2c22" }
container = { light = "#ce422b", dark = "#8f2d19" }
process = { light = "#e9d4c8", dark = "#2f2620" }
# The binaries in the accent and the tests in grey: kinds of their own, so
# neither reads as a module. (No crate here has examples, and a key for a
# kind the model lacks fails the survey.)
bin = { light = "#f0a884", dark = "#b5391f" }
tests = { light = "#d9d4cf", dark = "#4a4038" }

[rust]
# The landing site crates are excluded from the workspace (wasm32, big
# trees); they are still part of the architecture.
extra_manifests = ["crates/site/Cargo.toml", "crates/site-e2e/Cargo.toml"]

[[externals]]
id = "cargo"
kind = "process"
title = "cargo metadata"
technology = "cargo subprocess"
description = "Lists the workspace's packages and targets; `--no-deps --offline`, so no lockfile is touched."

[[externals.relations]]
from = "asbuilt_rust.discover"
title = "runs"

[[externals]]
id = "likec4"
kind = "process"
title = "LikeC4 CLI"
technology = "Node.js via npx, pinned version"
description = "Validates, exports and lays out the model. Only `validate`, `export json` and `render` reach it."

[[externals.relations]]
from = "asbuilt.likec4"
title = "runs"

[[externals]]
id = "graphviz"
kind = "process"
title = "Graphviz dot"
technology = "dot subprocess"
description = "Renders the Graphviz files LikeC4 generates to SVG."

[[externals.relations]]
from = "asbuilt.likec4"
title = "renders with"

[[externals]]
id = "chromium"
kind = "process"
title = "Chromium"
technology = "Playwright driver, via playwright-rs"
description = "The browser the site's end-to-end tests drive against the built landing page."

[[externals.relations]]
from = "asbuilt_site_e2e.tests"
title = "drives"
