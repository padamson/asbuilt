# Pre-commit hooks for Rust projects
# Install: cargo install prek && prek install
# Run manually: prek run

fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: detect-private-key
        name: Detect private keys
      # Byte-exact fixtures (the crates the front-end tests survey and
      # the `.c4` snapshots they are compared against) must not be
      # normalized by the whitespace hooks or the tests that compare
      # against them go red. All three exclude the fixture directories.
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: ^crates/[^/]+/tests/fixtures/
      - id: end-of-file-fixer
        name: Fix end of files
        exclude: ^crates/[^/]+/tests/fixtures/
      - id: mixed-line-ending
        name: Fix mixed line endings
        exclude: ^crates/[^/]+/tests/fixtures/

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Auto-format Rust code
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Run clippy linter
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: Check Rust code compiles
        entry: cargo check --workspace
        language: system
        types: [rust]
        pass_filenames: false

      # Keep this hook's feature set equal to the union of every
      # `--features` CI passes to its test steps. A test gated behind a
      # feature that only CI enables passes locally by never running,
      # then fails on push. When you add `--features foo` to a CI test
      # step, add it here in the same commit.
      - id: cargo-nextest
        name: cargo nextest run
        description: Run tests with nextest
        entry: cargo nextest run --workspace
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-doctest
        name: cargo test --doc
        description: Run documentation tests
        entry: cargo test --doc --workspace
        language: system
        types: [rust]
        pass_filenames: false

      # `cargo deny check` covers advisories too (it reads the RustSec
      # database), so there is no separate `cargo audit` hook and only one
      # ignore list, in `deny.toml`. Diff-gated on purpose: an advisory
      # published overnight should not block an unrelated commit; the
      # scheduled advisory-monitor workflow catches those.
      # Over the root and each excluded crate's manifest, one deny.toml.
      - id: cargo-deny
        name: cargo deny
        description: Check advisories, licenses, bans, and source restrictions
        entry: scripts/deny-all-manifests.sh
        language: system
        pass_filenames: false
        files: (Cargo\.toml|Cargo\.lock|deny\.toml)$

      # The excluded site crates are invisible to every --workspace command
      # above. Their lockfiles must be current (the refresh is an explicit
      # command, never a side effect of a commit), and their code must pass
      # the same fmt and clippy bar, for the site's real target.
      - id: external-lockfiles-current
        name: excluded crates' lockfiles current
        entry: scripts/check-external-lockfiles.sh
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|crates/site(-e2e)?/Cargo\.(toml|lock))$

      - id: site-crates-lint
        name: site crates fmt + clippy + host tests
        entry: bash -c 'cargo fmt --manifest-path crates/site/Cargo.toml -- --check && cargo fmt --manifest-path crates/site-e2e/Cargo.toml -- --check && cargo clippy --manifest-path crates/site/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings && cargo clippy --manifest-path crates/site-e2e/Cargo.toml --all-targets -- -D warnings && cargo nextest run --manifest-path crates/site/Cargo.toml --config-file .config/nextest.toml'
        language: system
        pass_filenames: false
        files: ^crates/site(-e2e)?/

      # Skips until `cargo vet init` has run (see SETUP.md), mirroring
      # the guard on the CI job, so the first commit of a new repo isn't
      # blocked on supply-chain setup. The `files` regex must match paths
      # *under* `supply-chain/`; an end-anchored `supply-chain/$` matches
      # nothing, and the hook then never fires on the audit files vet
      # exists to review.
      - id: cargo-vet
        name: cargo vet
        description: Verify dependency supply chain audits
        entry: bash -c 'test -f supply-chain/audits.toml && exec cargo vet; echo "supply-chain/ not initialized; skipping (run cargo vet init to enable)."'
        language: system
        pass_filenames: false
        files: (Cargo\.toml$|Cargo\.lock$|^supply-chain/)

      # asbuilt surveying itself: the committed model must match a fresh
      # survey of the code. No Node on this path; `cargo run` builds the
      # CLI if it is stale. The regex covers the model, the curated views
      # beside it, and every crate.
      - id: asbuilt-check
        name: asbuilt check
        description: The committed architecture model matches the code
        entry: cargo run -q -p asbuilt -- check
        language: system
        pass_filenames: false
        files: (docs/architecture/|crates/|asbuilt\.toml$)

      # A shipped skill's `metadata.version` is the only version an
      # installed copy carries: `npx skills add` copies and compares
      # nothing, so a content edit that leaves it alone is invisible to
      # every consumer. The `Skill version guard` CI job runs the same
      # script against the PR base.
      # asbuilt-core embeds a copy of brand/mark.path (a published crate
      # cannot include a file outside its directory); the two stay equal.
      - id: brand-copy-current
        name: brand mark copy current
        entry: scripts/check-brand-copy.sh
        language: system
        pass_filenames: false
        files: ^(brand/mark\.path|crates/asbuilt-core/src/mark\.path)$

      - id: skill-version-bumped
        name: skill version bumped
        description: Skill edits must bump the version consumers compare against
        entry: ./scripts/check-skill-version-bumped.sh
        language: system
        pass_filenames: false
        files: ^skills/
